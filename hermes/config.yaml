# Hermes Execution Agent Configuration
# Dedicated task execution agent for Sir Peterson and Jarvis.
# Holds execution authority over GitHub repositories (GITHUB_TOKEN / GITHUB_PAT)
# and Vercel projects (VERCEL_TOKEN / VERCEL_API_TOKEN).

model:
  default: claude-haiku-4-5
  provider: anthropic

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  home_mode: profile

web:
  backend: ddgs

approvals:
  mode: smart
  timeout: 300
  unattended_mode: deny
  cron_mode: deny
  single_query_mode: deny
  destructive_slash_confirm: true

skills:
  guard_agent_created: true

gateway:
  api_server:
    max_concurrent_runs: 2

display:
  interim_assistant_messages: false
