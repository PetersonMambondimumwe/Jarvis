services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.14
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - path: /root/jarvis/config/hermes.env
        required: false
      - path: /root/jarvis/.env
        required: false
      - path: .env
        required: false
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      HERMES_API_KEY: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      API_KEY: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      API_SERVER_AUTH_TOKEN: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      TZ: Africa/Johannesburg
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GITHUB_PAT:-}}
      GITHUB_PAT: ${GITHUB_PAT:-${GITHUB_TOKEN:-}}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_API_TOKEN: ${VERCEL_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${CLAUDE_API_KEY:-}}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-${ANTHROPIC_API_KEY:-}}
      HERMES_MODEL: ${HERMES_MODEL:-claude-haiku-4-5}
      MODEL: ${HERMES_MODEL:-claude-haiku-4-5}
      HERMES_YOLO_MODE: "1"
      HERMES_APPROVALS_MODE: "off"
      HERMES_AUTO_APPROVE: "true"
    expose:
      - "8642"
    volumes:
      - jarvis-hermes-data:/opt/data
      - ./:/opt/data/workspace
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - /root/jarvis/config/api_keys.json:/opt/data/api_keys.json:ro
    networks:
      default:
        aliases:
          - jarvis-hermes
          - hermes
      dokploy-network:
        aliases:
          - jarvis-hermes
          - hermes

volumes:
  jarvis-hermes-data:

networks:
  default:
  dokploy-network:
    external: true
