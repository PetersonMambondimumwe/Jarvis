services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # Persist configuration and memory data on your host server
      - /root/jarvis/config/api_keys.json:/app/config/api_keys.json:ro
      - ./memory:/app/memory
      - ./uploads:/app/uploads
      - ./.antigravity_bridge:/app/.antigravity_bridge
      - ./core:/app/core
      - ./dashboard:/app/dashboard
      - ./actions:/app/actions
      - ./main.py:/app/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=1
      - DISPLAY=:99
      - TZ=Africa/Johannesburg
      - JARVIS_TIMEZONE=Africa/Johannesburg
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - LINKEDIN_PRIMARY_CLIENT_SECTRET=${LINKEDIN_PRIMARY_CLIENT_SECTRET:-}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-https://jarvis.littleheartsacademy.online/auth/linkedin/callback}
    # IPC and shm configuration for high-throughput audio queues
    shm_size: '512m'
