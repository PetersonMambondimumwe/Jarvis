services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: /root/jarvis/config/hermes.env
        required: false
      - path: /root/jarvis/.env
        required: false
      - path: .env
        required: false
    volumes:
      # Persist configuration and memory data on your host server
      - /root/jarvis/config/api_keys.json:/app/config/api_keys.json:ro
      - ./memory:/app/memory
      - ./uploads:/app/uploads
      - ./.antigravity_bridge:/app/.antigravity_bridge
      - ./core:/app/core
      - ./dashboard:/app/dashboard
      - ./actions:/app/actions
      - ./main.py:/app/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=1
      - DISPLAY=:99
      - TZ=Africa/Johannesburg
      - JARVIS_TIMEZONE=Africa/Johannesburg
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-${LINKEDIN_API_KEY:-${LINKEDIN_KEY:-}}}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-${LINKEDIN_API_SECRET:-${LINKEDIN_SECRET:-${LINKEDIN_PRIMARY_CLIENT_SECRET:-${LINKEDIN_PRIMARY_CLIENT_SECTRET:-}}}}}
      - LINKEDIN_PRIMARY_CLIENT_SECRET=${LINKEDIN_PRIMARY_CLIENT_SECRET:-${LINKEDIN_CLIENT_SECRET:-${LINKEDIN_PRIMARY_CLIENT_SECTRET:-}}}
      - LINKEDIN_PRIMARY_CLIENT_SECTRET=${LINKEDIN_PRIMARY_CLIENT_SECTRET:-${LINKEDIN_CLIENT_SECRET:-}}
      - LINKEDIN_API_KEY=${LINKEDIN_API_KEY:-${LINKEDIN_CLIENT_ID:-}}
      - LINKEDIN_API_SECRET=${LINKEDIN_API_SECRET:-${LINKEDIN_CLIENT_SECRET:-}}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-https://jarvis.littleheartsacademy.online/auth/linkedin/callback}
      - LINKEDIN_SCOPES=${LINKEDIN_SCOPES:-openid profile email w_member_social}
      - LINKEDIN_MEMBER_ID=${LINKEDIN_MEMBER_ID:-}
      - HERMES_API_BASE=${HERMES_API_BASE:-http://jarvis-hermes:8642}
      - HERMES_API_KEY=${HERMES_API_KEY:-jarvis-hermes-internal-token}
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - DIFY_API_URL=${DIFY_API_URL:-https://asc-assistant-dify-662116-169-58-74-235.sslip.io/v1}
      - LEAF_AI_DIFY_API_KEY=${LEAF_AI_DIFY_API_KEY:-}
      - LEAF_AI_DIFY_API_URL=${LEAF_AI_DIFY_API_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-${CLAUDE_API_KEY:-}}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-${ANTHROPIC_API_KEY:-}}
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID:-${WHATSAPP_PHONE_NUMBER_ID:-}}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-${PHONE_NUMBER_ID:-}}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-${WHATSAPP_ACCESS_TOKEN:-}}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-${WHATSAPP_TOKEN:-}}
    networks:
      default:
        aliases:
          - jarvis-server
          - jarvis
      dokploy-network:
        aliases:
          - jarvis-server
          - jarvis
    # IPC and shm configuration for high-throughput audio queues
    shm_size: '512m'

  hermes:
    image: nousresearch/hermes-agent:v2026.9.14
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - path: /root/jarvis/config/hermes.env
        required: false
      - path: /root/jarvis/.env
        required: false
      - path: .env
        required: false
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      HERMES_API_KEY: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      API_KEY: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      API_SERVER_AUTH_TOKEN: ${HERMES_API_KEY:-jarvis-hermes-internal-token}
      TZ: Africa/Johannesburg
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GITHUB_PAT:-}}
      GITHUB_PAT: ${GITHUB_PAT:-${GITHUB_TOKEN:-}}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_API_TOKEN: ${VERCEL_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${CLAUDE_API_KEY:-}}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-${ANTHROPIC_API_KEY:-}}
      HERMES_MODEL: ${HERMES_MODEL:-claude-haiku-4-5}
      MODEL: ${HERMES_MODEL:-claude-haiku-4-5}
      HERMES_YOLO_MODE: "1"
      HERMES_APPROVALS_MODE: "off"
      HERMES_AUTO_APPROVE: "true"
    expose:
      - "8642"
    volumes:
      - jarvis-hermes-data:/opt/data
      - ./:/opt/data/workspace
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - /root/jarvis/config/api_keys.json:/opt/data/api_keys.json:ro
    networks:
      default:
        aliases:
          - jarvis-hermes
          - hermes
      dokploy-network:
        aliases:
          - jarvis-hermes
          - hermes

volumes:
  jarvis-hermes-data:

networks:
  default:
  dokploy-network:
    external: true
